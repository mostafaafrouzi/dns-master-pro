name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/dnsmaster-release.jks
          if [ ! -s keystore/dnsmaster-release.jks ]; then
            echo "Failed to decode keystore"
            exit 1
          fi
          printf '%s\n' \
            "storeFile=keystore/dnsmaster-release.jks" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties
          echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          echo "Release keystore configured successfully."
        else
          echo "Signing secrets missing or incomplete; building unsigned release."
          echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
        fi

    - name: Build release APK and AAB
      run: ./gradlew assembleRelease bundleRelease --stacktrace

    - name: Verify signatures
      run: |
        if [ "$SIGNED_RELEASE" = "true" ]; then
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
        fi

    - name: Get version
      id: get_version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        else
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "VERSION=v${NAME}" >> "$GITHUB_OUTPUT"
        fi

    - name: Name artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk \
           "dist/dnsmaster-${{ steps.get_version.outputs.VERSION }}.apk"
        cp app/build/outputs/bundle/release/app-release.aab \
           "dist/dnsmaster-${{ steps.get_version.outputs.VERSION }}.aab"
        rm -f keystore/dnsmaster-release.jks keystore.properties

    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dnsmaster-${{ steps.get_version.outputs.VERSION }}
        path: dist/*

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        draft: false
        prerelease: false
        generate_release_notes: false
        name: DNS Master Pro ${{ github.ref_name }}
        body_path: .github/release-notes.md
